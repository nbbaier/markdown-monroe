name: Release

on:
   workflow_dispatch:
      inputs:
         version:
            description: "Numeric Chrome version to release (for example, 0.2.0)"
            required: true
            type: string

concurrency:
   group: release
   cancel-in-progress: false

jobs:
   release:
      runs-on: ubuntu-latest
      permissions:
         contents: write
      env:
         VERSION: ${{ inputs.version }}
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: Require the main branch
           run: |
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "Releases must be run from the main branch"
                exit 1
              fi

         - name: Ensure the tag is new
           run: |
              if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
                echo "Tag v$VERSION already exists"
                exit 1
              fi

         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: latest

         - name: Install dependencies
           run: bun install --frozen-lockfile

         - name: Set release version
           run: bun scripts/set-version.ts "$VERSION"

         - name: Verify and package
           run: |
              bun run check
              bun run verify:fixtures
              bun run package
              git diff --check

         - name: Create checksum
           working-directory: release
           run: shasum -a 256 *.zip > checksums.txt

         - name: Upload workflow artifact
           uses: actions/upload-artifact@v4
           with:
              name: markdown-monroe-v${{ env.VERSION }}
              path: release/*

         - name: Commit and tag the release
           run: |
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              if ! git diff --quiet -- package.json public/manifest.json; then
                git add package.json public/manifest.json
                git commit -m "release: v$VERSION"
                git push origin HEAD:main
              fi
              git tag -a "v$VERSION" -m "Release v$VERSION"
              git push origin "v$VERSION"

         - name: Publish GitHub release
           uses: softprops/action-gh-release@v2
           with:
              tag_name: v${{ env.VERSION }}
              name: v${{ env.VERSION }}
              generate_release_notes: true
              files: release/*
